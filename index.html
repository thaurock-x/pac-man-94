<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080b20">
<title>PAC-MAN 94</title>
<style>
:root{--cyan:#29d9ff;--gold:#ffd84a;--pink:#ff4d9d;--bg:#080b20}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 0%,#18214a 0%,#090d24 55%,#050713 100%);color:#f5f7ff;font-family:system-ui,Segoe UI,sans-serif}
body{min-height:100svh;display:flex;justify-content:center;align-items:center;padding:14px;user-select:none;-webkit-user-select:none;overflow-x:hidden}
.game{width:min(100%,680px);display:flex;flex-direction:column;align-items:center;gap:12px}
header{width:100%;display:flex;align-items:center;justify-content:center;gap:12px}
.brand{font-size:clamp(1.5rem,6vw,2.5rem);font-weight:1000;letter-spacing:2px;line-height:1;background:linear-gradient(90deg,#ffe45c,#ff9d39,#ff4d9d);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 24px #ffbd4233;text-align:center}
.hud{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.stat{background:#101936;border:1px solid #263a70;border-radius:9px;padding:7px 10px;text-align:center;box-shadow:inset 0 0 14px #14244b}
.stat small{display:block;color:#8da6d9;font-size:.65rem;letter-spacing:1.5px;font-weight:800}
.stat strong{font:900 clamp(1rem,4vw,1.35rem) ui-monospace,monospace;color:#fff}
#score{color:#ffe36a}#best{color:#6dffd0}#level{color:#5ddcff}
.board-wrap{width:min(100%,560px);position:relative;border:3px solid #3478ff;border-radius:12px;padding:5px;background:#05091b;box-shadow:0 0 0 2px #101e51,0 0 32px #1465ff55, inset 0 0 25px #152c69}
canvas{display:block;width:100%;height:auto;aspect-ratio:1;background:#05091b;border-radius:5px;touch-action:none}
#screen{position:absolute;inset:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:#05091bdc;backdrop-filter:blur(5px);border-radius:6px}
#screen.hidden{display:none}
#screen h2{font-size:clamp(1.7rem,7vw,3rem);margin:0 0 8px;color:#ffe15b;text-shadow:0 0 20px #ffbb36aa;letter-spacing:2px}
#screen p{color:#c5d4ff;margin:4px 0 18px;max-width:340px}
button{font:800 .95rem system-ui;border:0;border-radius:9px;padding:11px 20px;background:linear-gradient(135deg,#ffe45c,#ff9f43);color:#171126;box-shadow:0 4px 0 #a95c24,0 0 18px #ffb23c44;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #a95c24}
.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.secondary{background:#15234a;color:#cce4ff;border:1px solid #3761ad;box-shadow:0 3px 0 #09122e}
.help{width:100%;display:flex;justify-content:space-between;gap:12px;align-items:center;color:#8fa5d8;font-size:.78rem}
kbd{font:700 .75rem monospace;background:#17244b;border:1px solid #3a568f;border-radius:4px;padding:2px 5px;color:#d9e7ff}
.mobile{display:none;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,48px);gap:5px;margin-top:1px}
.mobile button{padding:0;border-radius:10px;background:#14244c;color:#7ce5ff;border:1px solid #3774c8;box-shadow:0 3px 0 #08122d;font-size:1.35rem}
.mobile .up{grid-column:2;grid-row:1}.mobile .left{grid-column:1;grid-row:2}.mobile .down{grid-column:2;grid-row:2}.mobile .right{grid-column:3;grid-row:2}
footer{font: .65rem monospace;letter-spacing:1px;color:#516795;text-align:center}
@media(max-width:600px){body{padding:9px 8px}.game{gap:9px}.hud{gap:5px}.stat{padding:6px 3px}.help{display:none}.mobile{display:grid}.board-wrap{width:min(96vw,560px)}}
@media(max-height:760px) and (min-width:601px){body{align-items:flex-start}.game{gap:7px}.board-wrap{width:min(74vh,560px)}}
</style>
</head>
<body>
<main class="game">
<header><div class="brand">PAC-MAN 94</div></header>
<section class="hud">
 <div class="stat"><small>PUNTOS</small><strong id="score">00000</strong></div>
 <div class="stat"><small>RÉCORD</small><strong id="best">00000</strong></div>
 <div class="stat"><small>NIVEL</small><strong id="level">01</strong></div>
 <div class="stat"><small>VIDAS</small><strong id="lives">♥♥♥</strong></div>
</section>
<div class="board-wrap">
 <canvas id="game" width="560" height="560" aria-label="Tablero de Pac-Man"></canvas>
 <div id="screen">
  <h2 id="screenTitle">PAC-MAN 94</h2>
  <p id="screenText">Come todos los puntos, consigue las superbolas y escapa de los fantasmas. ¡Cuidado con los pasillos!</p>
  <div class="actions"><button id="start">JUGAR</button><button class="secondary" id="sound">SONIDO: ON</button></div>
 </div>
</div>
<div class="help"><span>Movimiento: <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> o <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span><kbd>ESPACIO</kbd> Pausa · <kbd>R</kbd> Reiniciar</span></div>
<div class="mobile">
 <button class="up" data-dir="0,-1">▲</button><button class="left" data-dir="-1,0">◀</button>
 <button class="down" data-dir="0,1">▼</button><button class="right" data-dir="1,0">▶</button>
</div>
</main>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const TILE=28, N=20, W=560;
const raw=[
"####################",
"#........##........#",
"#.##.###.##.###.##.#",
"#o##.###.##.###.##o#",
"#..................#",
"#.##.#.######.#.##.#",
"#....#...##...#....#",
"####.###.##.###.####",
"####.#........#.####",
"####.#.##  ##.#.####",
"    . .#    #. .    ",
"####.#.########.####",
"####.#..........####",
"####.#.######.#.####",
"#........##........#",
"#.##.###.##.###.##.#",
"#o.#...........#.o.#",
"##.#.#.######.#.#.##",
"#....#...##...#....#",
"####################"
];
const dirs=[{x:0,y:-1},{x:0,y:1},{x:-1,y:0},{x:1,y:0}];
const opposite=(a,b)=>a.x===-b.x&&a.y===-b.y;
let map,pellets,totalPellets,player,ghosts,score=0,best=0,level=1,lives=3,paused=false,playing=false,over=false,fright=0,fruitTimer=0,frame=0,last=0,acc=0,mute=false,audio=null;
try{best=+(localStorage.getItem('pacman94Best')||0)}catch(e){}
$('best').textContent=fmt(best);
function fmt(n){return String(n).padStart(5,'0')}
function sound(freq=440,dur=.07,type='square'){
 if(mute)return;
 try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}
}
function makeMap(){
 map=raw.map(r=>r.split(''));pellets=0;
 for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(map[y][x]==='.'||map[y][x]==='o')pellets++;
 totalPellets=pellets;
}
function resetActors(){
 player={x:9,y:16,dir:{x:0,y:0},want:{x:0,y:0},px:9,py:16,mouth:0};
 const starts=[{x:9,y:9,c:'#ff4c68',name:0},{x:10,y:9,c:'#42eaff',name:1},{x:9,y:10,c:'#ff9fe0',name:2},{x:10,y:10,c:'#ffad42',name:3}];
 ghosts=starts.map((g,i)=>({...g,dir:dirs[i%4],px:g.x,py:g.y,home:0}));
 fright=0;fruitTimer=0;
}
function fresh(){
 makeMap();resetActors();score=0;level=1;lives=3;paused=false;over=false;playing=true;updateHud();hideScreen();last=0;acc=0;
}
function updateHud(){$('score').textContent=fmt(score);$('best').textContent=fmt(best);$('level').textContent=String(level).padStart(2,'0');$('lives').textContent='♥'.repeat(lives)||'—'}
function addScore(n){score+=n;if(score>best){best=score;try{localStorage.setItem('pacman94Best',best)}catch(e){}}updateHud()}
function showScreen(title,text,button='JUGAR'){ $('screenTitle').textContent=title;$('screenText').textContent=text;$('start').textContent=button;$('screen').classList.remove('hidden')}
function hideScreen(){$('screen').classList.add('hidden')}
function wall(x,y){if(y<0||y>=N||x<0||x>=N)return true;return map[y][x]==='#'}
function canMove(x,y,d){return !wall(x+d.x,y+d.y)}
function snap(a){a.x=Math.round(a.x);a.y=Math.round(a.y)}
function advanceGrid(a,spd){
 // Cruza de centro a centro y evita reiniciar el movimiento a mitad de casilla.
 if(a.dir.x){
  const target=a.dir.x>0?Math.floor(a.x)+1:Math.ceil(a.x)-1;
  const next=a.x+a.dir.x*spd;
  a.x=(a.dir.x>0?next>=target:next<=target)?target:next;
 }else if(a.dir.y){
  const target=a.dir.y>0?Math.floor(a.y)+1:Math.ceil(a.y)-1;
  const next=a.y+a.dir.y*spd;
  a.y=(a.dir.y>0?next>=target:next<=target)?target:next;
 }
}
function stepActor(a,spd,isPlayer=false){
 const cx=Math.round(a.x),cy=Math.round(a.y);
 const center=Math.abs(a.x-cx)<.001&&Math.abs(a.y-cy)<.001;
 if(center){
  a.x=cx;a.y=cy;
  if(isPlayer&&canMove(cx,cy,a.want))a.dir={...a.want};
  if(!canMove(cx,cy,a.dir))a.dir={x:0,y:0};
 }
 if(a.dir.x||a.dir.y)advanceGrid(a,spd);
}
function eat(){
 const x=Math.round(player.x),y=Math.round(player.y),v=map[y]?.[x];
 if(v==='.'||v==='o'){map[y][x]=' ';addScore(v==='o'?50:10);pellets--;
  if(v==='o'){fright=8*60;sound(180,.2,'sawtooth')}
  else sound(520+(frame%3)*80,.035,'square');
  if(pellets<=0)nextLevel();
 }
}
function nextLevel(){level++;makeMap();resetActors();addScore(100);updateHud();sound(740,.25,'triangle')}
function chooseGhostDir(g){
 const x=Math.round(g.x),y=Math.round(g.y);
 let opts=dirs.filter(d=>canMove(x,y,d)&&!opposite(d,g.dir));
 if(!opts.length)opts=dirs.filter(d=>canMove(x,y,d));
 if(!opts.length)return;
 if(fright>0)opts.sort(()=>Math.random()-.5);
 else{
  const target= g.name===0?player:{x:player.x+(g.name===1?2:g.name===2?-2:0),y:player.y+(g.name===3?2:0)};
  opts.sort((a,b)=>{
   const da=(x+a.x-target.x)**2+(y+a.y-target.y)**2,db=(x+b.x-target.x)**2+(y+b.y-target.y)**2;
   return fright>0?db-da:da-db;
  });
  if(Math.random()<.16)opts.reverse();
 }
 g.dir=opts[0];
}
function moveGhost(g){
 const cx=Math.round(g.x),cy=Math.round(g.y);
 const center=Math.abs(g.x-cx)<.02&&Math.abs(g.y-cy)<.02;
 if(center){
  g.x=cx;g.y=cy;
  chooseGhostDir(g);
  // Si tras elegir dirección sigue siendo inválida, detener
  if(!canMove(cx,cy,g.dir))g.dir={x:0,y:0};
 }
 const spd=fright>0?.035:.027+Math.min(level-1,6)*.002;
 // Solo avanzar si hay dirección; no volver a comprobar paredes a mitad de casilla
 // (evita que Math.round cambie de tile antes de llegar al centro y se queden bloqueados)
 if(g.dir.x||g.dir.y)advanceGrid(g,spd);
}
function collide(){
 for(const g of ghosts){
  if(Math.hypot(player.x-g.x,player.y-g.y)<.58){
   if(fright>0){g.x=9.5;g.y=9.5;g.dir=dirs[Math.floor(Math.random()*4)];addScore(200);sound(260,.12,'triangle')}
   else{loseLife();return}
  }
 }
}
function loseLife(){lives--;updateHud();sound(110,.4,'sawtooth');if(lives<=0){playing=false;over=true;showScreen('FIN DE PARTIDA','Puntuación: '+score+' · Récord: '+best,'VOLVER A JUGAR')}else{resetActors();}}
function update(){
 if(!playing||paused||over)return;frame++;
 stepActor(player,.055+Math.min(level-1,5)*.002,true);eat();
 ghosts.forEach(moveGhost);collide();
 if(fright>0)fright--;
}
function drawWall(x,y){
 const px=x*TILE,py=y*TILE;
 ctx.fillStyle='#101b50';ctx.fillRect(px+1,py+1,TILE-2,TILE-2);
 ctx.strokeStyle='#287dff';ctx.lineWidth=2;ctx.strokeRect(px+3,py+3,TILE-6,TILE-6);
 ctx.strokeStyle='#4ab8ff';ctx.lineWidth=1;ctx.strokeRect(px+6,py+6,TILE-12,TILE-12);
}
function drawPac(){
 const x=(player.x+.5)*TILE,y=(player.y+.5)*TILE,r=10.5;
 const d=player.dir,angle=Math.atan2(d.y,d.x),mouth=(Math.sin(frame*.22)+1)*.19+.04;
 ctx.fillStyle='#ffdf42';ctx.shadowColor='#ffcb35';ctx.shadowBlur=13;ctx.beginPath();
 if(!d.x&&!d.y){ctx.arc(x,y,r,0,Math.PI*2)}else{ctx.moveTo(x,y);ctx.arc(x,y,r,angle+mouth,angle+Math.PI*2-mouth);ctx.closePath()}
 ctx.fill();ctx.shadowBlur=0;
}
function drawGhost(g){
 const x=(g.x+.5)*TILE,y=(g.y+.5)*TILE,r=10;
 const frightened=fright>0,body=frightened?(fright<100&&Math.floor(frame/8)%2?'#f5f5ff':'#344bdb'):g.c;
 ctx.fillStyle=body;ctx.shadowColor=body;ctx.shadowBlur=frightened?4:9;ctx.beginPath();ctx.arc(x,y-1,r,Math.PI,0);ctx.lineTo(x+r,y+9);ctx.lineTo(x+5,y+6);ctx.lineTo(x,y+10);ctx.lineTo(x-5,y+6);ctx.lineTo(x-r,y+9);ctx.closePath();ctx.fill();ctx.shadowBlur=0;
 if(!frightened){ctx.fillStyle='white';ctx.beginPath();ctx.ellipse(x-4,y-1,3.1,4.2,0,0,Math.PI*2);ctx.ellipse(x+4,y-1,3.1,4.2,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#13204c';ctx.beginPath();ctx.arc(x-4+(g.dir.x*1.2),y-1+g.dir.y*1.2,1.6,0,7);ctx.arc(x+4+g.dir.x*1.2,y-1+g.dir.y*1.2,1.6,0,7);ctx.fill()}
 else{ctx.fillStyle='white';ctx.beginPath();ctx.arc(x-4,y-1,1.5,0,7);ctx.arc(x+4,y-1,1.5,0,7);ctx.fill()}
}
function draw(){
 ctx.fillStyle='#05091b';ctx.fillRect(0,0,W,W);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  if(map[y][x]==='#')drawWall(x,y);
  else if(map[y][x]==='.'){ctx.fillStyle='#ffe9a5';ctx.shadowColor='#ffe9a5';ctx.shadowBlur=5;ctx.beginPath();ctx.arc((x+.5)*TILE,(y+.5)*TILE,2.1,0,7);ctx.fill();ctx.shadowBlur=0}
  else if(map[y][x]==='o'){ctx.fillStyle='#fff2bd';ctx.shadowColor='#fff';ctx.shadowBlur=13;ctx.beginPath();ctx.arc((x+.5)*TILE,(y+.5)*TILE,5.5+Math.sin(frame*.15)*1.2,0,7);ctx.fill();ctx.shadowBlur=0}
 }
 // Puerta de la guarida
 ctx.fillStyle='#ff8ad2';ctx.fillRect(9*TILE+3,10*TILE,2*TILE-6,3);
 ghosts.forEach(drawGhost);drawPac();
 if(paused&&playing){ctx.fillStyle='#030718aa';ctx.fillRect(0,0,W,W);ctx.fillStyle='#fff';ctx.font='900 42px system-ui';ctx.textAlign='center';ctx.fillText('PAUSA',W/2,W/2)}
}
function loop(t){if(!last)last=t;let dt=Math.min(40,t-last);last=t;acc+=dt;while(acc>16.67){update();acc-=16.67}draw();requestAnimationFrame(loop)}
function setDir(x,y){player.want={x,y};if(!playing){if(over)return;return}}
document.addEventListener('keydown',e=>{
 if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
 const k=e.key.toLowerCase(),m={'arrowup':dirs[0],'w':dirs[0],'arrowdown':dirs[1],'s':dirs[1],'arrowleft':dirs[2],'a':dirs[2],'arrowright':dirs[3],'d':dirs[3]};
 if(m[k]){e.preventDefault();setDir(m[k].x,m[k].y)}
 if(k===' '){e.preventDefault();if(playing){paused=!paused;sound(360,.06)}}
 if(k==='r'){fresh()}
});
document.querySelectorAll('[data-dir]').forEach(b=>{
 const go=e=>{e.preventDefault();const [x,y]=b.dataset.dir.split(',').map(Number);setDir(x,y)};
 b.addEventListener('pointerdown',go);
});
let touchStart=null;
canvas.addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchStart={x:t.clientX,y:t.clientY}},{passive:true});
canvas.addEventListener('touchend',e=>{if(!touchStart)return;const t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;if(Math.max(Math.abs(dx),Math.abs(dy))>18){if(Math.abs(dx)>Math.abs(dy))setDir(Math.sign(dx),0);else setDir(0,Math.sign(dy))}touchStart=null},{passive:true});
$('start').addEventListener('click',()=>{if(over||!playing)fresh();else{paused=false;hideScreen()}});
$('sound').addEventListener('click',()=>{mute=!mute;$('sound').textContent='SONIDO: '+(mute?'OFF':'ON');if(!mute)sound(600,.08)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)paused=true});
makeMap();resetActors();draw();showScreen('PAC-MAN 94','Come todos los puntos, consigue las superbolas y escapa de los fantasmas. ¡Cuidado con los pasillos!','JUGAR');requestAnimationFrame(loop);
})();
</script>
</body>
</html>
